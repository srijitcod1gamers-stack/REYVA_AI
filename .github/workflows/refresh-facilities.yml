name: Refresh regional OSM facility snapshot

on:
  schedule:
    - cron: '15 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-facility-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy<2' xarray dask netcdf4 cfgrib eccodes rasterio scipy metpy
      - name: Fetch complete regional snapshot and publish tiles atomically
        run: python -m ml_service.facilities
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      - name: Register the published facility catalog in production
        run: |
          python - <<'PY'
          import json, urllib.request
          request = urllib.request.Request('https://reyva-ai.pages.dev/api/facilities', headers={'User-Agent':'Mozilla/5.0 REYVA-facility-health/1.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              catalog = json.load(response)
          assert catalog['complete_query'] and catalog['facilities'] > 0
          print('Published facilities:', catalog['facilities'], catalog['retrieved_at'])
          PY
