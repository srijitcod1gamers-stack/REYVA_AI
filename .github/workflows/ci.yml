name: Verify TypeScript application and API

on:
  push:
    branches: [main]
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run worker:typecheck
      - run: npm test
      - run: npx playwright install --with-deps msedge
      - run: npm run test:e2e
