name: Verify application and API contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run worker:typecheck
      - run: npm test
      - run: npx playwright install --with-deps msedge
      - run: npm run test:e2e
  ml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q -x '(\.venv|artifacts|data)' ml_service
      - run: pip install 'numpy<2' xarray dask netcdf4 cfgrib eccodes rasterio scipy metpy
      - run: python -m unittest discover -s ml_service/tests
