name = "weather-intelligence-api"
main = "src/worker.ts"
compatibility_date = "2026-09-27"
workers_dev = true

[vars]
MODE = "demo"
ALLOWED_ORIGIN = "http://127.0.0.1:5173"
FASTAPI_ORIGIN = ""

[[r2_buckets]]
binding = "WEATHER_ASSETS"
bucket_name = "weather-intelligence-assets"

[[d1_databases]]
binding = "WEATHER_DB"
database_name = "weather-intelligence"
# Replace after: wrangler d1 create weather-intelligence
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
