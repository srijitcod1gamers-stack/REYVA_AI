name = "weather-intelligence-api"
main = "src/worker.ts"
compatibility_date = "2026-09-27"
workers_dev = true

[vars]
MODE = "live"
ALLOWED_ORIGIN = "http://127.0.0.1:5173,https://reyva-ai.pages.dev"
# Set ML_API_ORIGIN to your private HTTPS FastAPI endpoint for deployed inference.
# Set ML_API_KEY and ADMIN_API_TOKEN as Worker secrets, never in this file.
# Backblaze B2 replaces R2. Configure B2_ENDPOINT, B2_REGION, B2_BUCKET,
# B2_KEY_ID, and B2_APPLICATION_KEY with .dev.vars locally and Worker secrets in production.

[[d1_databases]]
binding = "WEATHER_DB"
database_name = "weather-intelligence"
# Replace after: wrangler d1 create weather-intelligence
database_id = "573ec768-ddfd-4826-ab86-96c6e9bffd7c"
migrations_dir = "migrations"
